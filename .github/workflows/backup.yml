name: Backup production

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, 03:00 in Montevideo
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Require the encryption passphrase
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Missing BACKUP_PASSPHRASE secret; refusing to upload an unencrypted backup."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db dump --linked -f roles.sql --role-only
      - run: supabase db dump --linked -f schema.sql
      - run: supabase db dump --linked -f data.sql --use-copy --data-only

      # Anyone with read access to the repo can download artifacts, so only the encrypted file leaves the runner.
      # Restore: gpg --decrypt backup.tar.gz.gpg | tar xz
      - name: Encrypt with GPG
        run: |
          tar czf backup.tar.gz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output backup.tar.gz.gpg backup.tar.gz <<< "$BACKUP_PASSPHRASE"
          rm roles.sql schema.sql data.sql backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 90
