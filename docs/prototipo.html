    body=`<div class="stack"><h2>Nuevo americano</h2>
      <label class="field">Nombre<input id="tc-name" value="${f.name}"></label>
      <div class="grid2">
        <label class="field">Día${sel('tc-d',DAYS.map((_,i)=>[i,dayLabel(i,true)]),f.d)}</label>
        <label class="field">Empieza${sel('tc-t',TIMES.map(t=>[t,t]),f.t)}</label>
        <label class="field">Jugadores${sel('tc-size',[[8,'8'],[12,'12'],[16,'16']],f.size)}</label>
        <label class="field">Rondas${sel('tc-rounds',[3,4,5,6,7,9,11,15].map(n=>[n,n]),f.rounds)}</label>
        <label class="field">Puntos por partido${sel('tc-pts',[[16,'16'],[21,'21'],[24,'24'],[32,'32']],f.points)}</label>
        <label class="field">Minutos por ronda${sel('tc-min',[[15,'15'],[20,'20'],[25,'25']],f.minRound)}</label>
        <label class="field">Categoría desde${sel('tc-cmin',cats,f.catMin)}</label>
        <label class="field">hasta${sel('tc-cmax',cats,f.catMax)}</label>
        <label class="field">Género${sel('tc-g',[['M','Masculino'],['F','Femenino'],['X','Mixto']],f.gender)}</label>
        <label class="field">Inscripción ($)<input id="tc-price" type="number" min="0" step="50" value="${f.price}"></label>
      </div>
      <div class="field">Canchas<div class="checks">${COURTS.map(c=>`<label class="row"><input type="checkbox" class="tc-court" value="${c.id}" ${f.courts.includes(c.id)?'checked':''}> ${c.name}</label>`).join('')}</div></div>
      ${s.error?`<div class="notice bad">${s.error}</div>`:''}
      <p class="small muted">Con 8 jugadores y 2 canchas se juega una ronda completa a la vez. Con menos canchas, cada ronda se divide en turnos y el torneo dura más.</p>
      <button class="btn ball block" data-action="tourn-save">Crear torneo y bloquear canchas</button></div>`;
  }
  if(s.kind==='cal-confirm'){
    const dt=fromIso(s.v), n=soldOnDate(dt);
    body=`<div class="stack"><h2>¿Cerrar ${s.pid?productOf(s.pid).name.toLowerCase():'el day use'} el ${longDate(dt).toLowerCase()}?</h2>
      <div class="notice">Ya se ${n===1?'vendió 1 pase':'vendieron '+n+' pases'} para ese día. Si lo cerrás, les avisamos por WhatsApp y se les devuelve el dinero o se les ofrece otro día.</div>
      <p class="small muted">Las canchas bloqueadas por el day use quedan libres para reservar.</p>
      <button class="btn danger block" data-action="${s.pid?'cal-toggle':'cal-close'}" data-v="${s.v}" ${s.pid?`data-pid="${s.pid}"`:''} data-ok="1">Cerrar y avisar</button>
      <button class="btn ghost block" data-action="close">Mantener abierto</button></div>`;
  }
  if(s.kind==='du-edit'){
    const f=s.draft, sel=(opts,cur,field)=>`<select data-change="du-draft" data-f="${field}">${opts.map(t=>`<option ${t===cur?'selected':''}>${t}</option>`).join('')}</select>`;
    const hit=[]; if(f.from<f.to) for(let d=0;d<7;d++) if((()=>{const o=DU.overrides[iso(DAYS[d])]; return (o&&f.id in o)?o[f.id]:f.days.includes(dowOf(d));})()) TIMES.filter(t=>t>=f.from&&t<f.to).forEach(t=>f.courts.forEach(c=>{const o=OCC[k(d,t,c)]; if(o&&o.du!==f.id) hit.push(`${dayLabel(d).toLowerCase()} ${t}, Cancha ${c}`);}));
    body=`<div class="stack"><h2>${f.name}</h2>
      <div class="field">Qué días se vende<div class="opts">${[1,2,3,4,5,6,0].map(x=>`<button class="opt" aria-pressed="${f.days.includes(x)}" data-action="du-d-day" data-v="${x}">${DOW_SHORT[x]}</button>`).join('')}</div></div>
      <div class="grid2"><label class="field">Desde${sel(TIMES,f.from,'from')}</label><label class="field">Hasta${sel(END_TIMES,f.to,'to')}</label></div>
      <div class="field">Canchas que quedan libres para el day use<div class="opts">${COURTS.map(c=>`<button class="opt" aria-pressed="${f.courts.includes(c.id)}" data-action="du-d-court" data-v="${c.id}">${c.name}</button>`).join('')}</div>
        <span class="small muted" style="font-weight:400">Si no elegís ninguna, el pase no bloquea canchas (por ejemplo, un pase solo de pileta).</span></div>
      <div class="grid2"><label class="field">Cupo por día<input id="de-cupo" type="number" min="1" value="${f.cupo}"></label><label class="field">Precio ($)<input id="de-price" type="number" min="0" step="50" value="${f.price}"></label></div>
      ${f.from>=f.to?`<div class="notice bad">El horario "hasta" tiene que ser posterior a "desde".</div>`
        :`<div class="notice good">${scheduleText(f)}</div>${hit.length?`<div class="notice">Hay ${hit.length} ${hit.length===1?'turno ocupado':'turnos ocupados'} en ese horario (${hit.slice(0,3).join('; ')}${hit.length>3?'…':''}). Se respetan y se bloquean cuando se liberen.</div>`:''}`}
      <button class="btn ball block" data-action="du-save" ${f.from>=f.to||!f.days.length?'disabled':''}>Guardar y actualizar la grilla</button></div>`;
  }
  if(s.kind==='du-buy'){
    const dd=state.duDay||0, avail=productsOn(dd);
    const sel=(s.product&&avail.some(p=>p.id===s.product))?s.product:avail[0].id, pr=productOf(sel);
    const canReward=rewardApplies('me') && (DU.loyalty.scope==='todos'||DU.loyalty.scope===sel);
    const useR=canReward && s.useReward!==false;
    body=`<div class="stack"><h2>Pase para ${dayLabel(dd,true).toLowerCase()}</h2>
      ${avail.map(p=>`<button class="prod" aria-pressed="${p.id===sel}" data-action="du-pick" data-v="${p.id}"><div class="row between"><b>${p.name}</b><span class="score">${fmt(p.price)}</span></div><p class="small">De ${p.from} a ${p.to}</p>${chips(p.includes.map(t=>({t})))}<p class="small muted" style="margin-top:6px">Quedan ${p.cupo-soldOn(p.id,dd)} lugares</p></button>`).join('')}
      ${canReward?`<label class="row small"><input type="checkbox" data-change="du-reward" ${useR?'checked':''}> Usar mi recompensa: ${rewardLabel()}</label>`:''}
      <button class="btn ball block" data-action="du-confirm">${useR?(rewardPrice(pr)?`Comprar a ${fmt(rewardPrice(pr))}`:'Usar mi day use gratis'):`Comprar, ${fmt(pr.price)}`}</button>
      <p class="small muted">Te damos un QR para mostrar en recepción.${DU.loyalty.on&&!useR?' El sello se suma cuando entrás.':''}</p></div>`;
  }
  if(s.kind==='du-pass'){
    const x=DU.passes.find(p=>p.id===s.id), pr=productOf(x.product), l=loyaltyOf(x.pid);
    body=`<div class="stack" style="text-align:center"><h2>${pr.name}</h2><p class="muted">${dayLabel(x.d||0,true)}, de ${pr.from} a ${pr.to}. Mostralo en recepción.</p>
      ${qrSVG(x.code)}<p class="score">${x.code}</p>
      ${chips(pr.includes.map(t=>({t})))}
      ${x.status==='adentro'?'<div class="notice good">Ingreso registrado. Disfrutá el día.</div>':'<p class="small muted">El sello se suma cuando registran tu ingreso.</p>'}
      ${DU.loyalty.on?`<div style="display:flex;justify-content:center">${stampsHTML(x.pid)}</div><p class="small">${l.available?`Tenés ${rewardLabel()} para la próxima.`:`Te ${l.left===1?'falta 1':'faltan '+l.left} para ${rewardLabel()}.`}</p>`:''}
      <div class="stack" style="text-align:left;border-top:1px solid var(--line);padding-top:12px"><h3>Ya están en el club</h3>${insideHTML()}</div>
      <button class="btn block" data-action="close">Listo</button></div>`;
  }
  if(s.kind==='du-sell'){
    const opts=Object.values(P).filter(p=>p.id!=='me').map(p=>{const l=loyaltyOf(p.id);return `<option value="${p.id}" ${s.pid===p.id?'selected':''}>${p.name}${DU.loyalty.on?(l.available?', tiene recompensa':`, ${l.progress} de ${DU.loyalty.every}`):''}</option>`;}).join('');
    const pid=s.pid||'p1', canR=rewardApplies(pid);
    body=`<div class="stack"><h2>Vender day use en recepción</h2>
      <label class="field">Cliente<select id="ds-p" data-change="du-sell-p">${opts}</select></label>
      <label class="field">Pase<select id="ds-prod">${productsOn(0).map(p=>`<option value="${p.id}">${p.name}, ${fmt(p.price)}</option>`).join('')}</select></label>
      ${canR?`<label class="row small"><input type="checkbox" id="ds-r" checked> Usar su recompensa: ${rewardLabel()}</label>`:DU.loyalty.on?`<p class="small muted">${P[pid].name} lleva ${loyaltyOf(pid).progress} de ${DU.loyalty.every} sellos.</p>`:''}
      <button class="btn ball block" data-action="du-sell-ok">Vender y registrar ingreso</button></div>`;
  }
  return `<div class="scrim" data-action="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="xbtn" data-action="close" aria-label="Cerrar">×</button><div class="sheet-body">${body}</div></div>`;
}

function render(){
  const player = state.role==='jugador';
  const views={inicio:viewInicio,reservar:viewReservar,partidos:viewPartidos,torneos:viewTorneos,perfil:viewPerfil,dayuse:viewDayUse};
  app.innerHTML = `
    <header class="proto"><div class="proto-in"><div class="brand"><span class="dot"></span>${CLUB}</div>
      <div class="row" style="gap:4px"><span class="caption">Ver como</span><div class="seg" role="group" aria-label="Ver como"><button aria-pressed="${player}" data-action="role" data-v="jugador">Jugador</button><button aria-pressed="${!player}" data-action="role" data-v="club">Club</button></div></div></div></header>
    <main class="shell ${player?'':'wide'}">${player?views[state.tab]():viewClub()}</main>
    ${player?`<nav class="tabbar"><div class="tabbar-in">${['inicio','reservar','partidos','torneos','perfil'].map(t=>`<button data-action="tab" data-tab="${t}" ${(state.tab===t||(t==='inicio'&&state.tab==='dayuse'))?'aria-current="page"':''}>${ICONS[t]}${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div></nav>`:''}
    ${sheetHTML()}
    ${state.toast?`<div class="toast" role="status">${state.toast}</div>`:''}`;
}

/* ---------- acciones ---------- */
const findM = id => M.find(m=>m.id===id);
function fillSlot(m,i,pid){
  m.slots[i].pid=pid;
  if(!openSlots(m).length){ complete(m); state.sheet={kind:'result',mid:m.id}; }
}
const A = {
  role:e=>{state.role=e.v;state.sheet=null;},
  tab:e=>{state.tab=e.tab;state.sheet=null;window.scrollTo(0,0);},
  day:e=>{state[e.key]=+e.day;},
  filter:e=>{state.onlyMine=e.v==='1';},
  close:()=>{state.sheet=null;},
  'open-match':e=>{state.sheet={kind:'match',mid:e.mid};},
  'back-match':e=>{state.sheet={kind:'match',mid:e.mid};},
  join:e=>{state.sheet={kind:'join',mid:e.mid,slot:+e.slot};},
  'confirm-join':e=>{
    const m=findM(e.mid), i=+e.slot;
    if(!canJoin(m,i).ok){ toast(canJoin(m,i).why||'Ese lugar ya no está libre'); return; }
    fillSlot(m,i,'me');
    if(m.status==='formando'){ state.sheet={kind:'match',mid:m.id}; toast(`Te sumaste de ${SIDE_LOW[m.slots[i].side]}. Faltan ${openSlots(m).length}.`); }
  },
  leave:e=>{ const m=findM(e.mid); m.slots.forEach(s=>{if(s.pid==='me')s.pid=null;}); if(!m.slots.some(s=>s.pid)) m.status='cancelado', m.cancelReason='Se canceló porque no quedó nadie anotado.'; state.sheet=null; toast('Saliste del partido'); },
  invite:e=>{ const m=findM(e.mid); m.invited.push(e.pid); toast(`Le avisamos a ${P[e.pid].name} por WhatsApp`); },
  accept:e=>{
    const m=findM(e.mid), p=P[e.pid];
    const i=m.slots.findIndex(s=>!s.pid&&s.side===p.side); const j=i>=0?i:m.slots.findIndex(s=>!s.pid&&fits(p,s.side));
    if(j<0){ toast('Ya no hay lugar para su lado'); return; }
    fillSlot(m,j,p.id);
    if(m.status==='formando') toast(`${first(p.name)} se sumó de ${SIDE_LOW[m.slots[j].side]}`);
  },
  share:e=>{state.sheet={kind:'share',mid:e.mid};},
  copy:()=>{ const t=document.getElementById('sharetxt'); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Mensaje copiado'),()=>{t.select();toast('Seleccioná y copiá el texto');}); }catch(err){ t.select(); toast('Seleccioná y copiá el texto'); } },
  book:e=>{state.sheet={kind:'book',d:+e.d,t:e.t,c:+e.c};},
  'confirm-book':e=>{
    const d=+e.d,c=+e.c;
    if(OCC[k(d,e.t,c)]){ toast('Esa cancha se acaba de ocupar'); state.sheet=null; return; }
    if(isBusy('me',d,e.t)){ toast('Ya tenés un partido a esa hora'); return; }
    OCC[k(d,e.t,c)]={type:'reserva',label:P.me.name,players:['me'],src:'online'};
    state.sheet=null; toast(`Reservaste la Cancha ${c}, ${dayLabel(d).toLowerCase()} ${e.t}`);
  },
  create:e=>{ state.sheet={kind:'create',prefill:e.d!==undefined?{d:+e.d,t:e.t,c:+e.c}:null}; },
  'confirm-create':()=>{
    const v=id=>document.getElementById(id).value;
    const d=+v('f-d'), t=v('f-t'), c=+v('f-c'), g=v('f-g'), mn=+v('f-min'), mx=+v('f-max'), side=v('f-s'), fb=document.getElementById('f-fb').checked;
    const err = mn>mx ? 'La categoría "desde" tiene que ser igual o mejor que "hasta".'
      : (g!=='X' && g!==P.me.g) ? 'No podés armar un partido de otro género.'
      : (P.me.cat<mn||P.me.cat>mx) ? `Tu categoría (${CAT[P.me.cat]}) tiene que estar dentro del rango.`
      : isBusy('me',d,t) ? 'Ya tenés un partido a esa hora.'
      : !freeCourts(d,t).length ? 'No hay canchas libres a esa hora. Probá otro horario.'
      : (!fb && OCC[k(d,t,c)]) ? `La Cancha ${c} ya está ocupada a esa hora.` : null;
    if(err){ state.sheet={kind:'create',prefill:{d,t,c},error:err}; return; }
    const m=mkMatch({d,t,pref:c,catMin:mn,catMax:mx,gender:g,fallback:fb,createdBy:'me',slots:S(side==='drive'?'me':null,side==='reves'?'me':null,null,null)});
    state.sheet={kind:'match',mid:m.id}; toast('Partido publicado. Mirá a quién invitar.');
  },
  'set-side':e=>{P.me.side=e.v;},
  'set-hand':e=>{P.me.hand=e.v;},
  'set-vis':e=>{state.visibility=e.v;},
  'set-showdu':e=>{P.me.showDU=e.v==='1';},
  'toggle-court':e=>{ const id=+e.v, a=P.me.pref; P.me.pref=a.includes(id)?a.filter(x=>x!==id):[...a,id]; },
  'toggle-avail':e=>{ const a=P.me.avail[e.dw]||[]; P.me.avail[e.dw]=a.includes(e.f)?a.filter(x=>x!==e.f):[...a,e.f]; },
  'club-add':e=>{state.sheet={kind:'club-add',d:+e.d,t:e.t,c:+e.c};},
  'club-save':e=>{
    const type=document.getElementById('ca-type').value, name=document.getElementById('ca-name').value.trim()||({reserva:'Reserva',fijo:'Turno fijo',bloqueo:'Bloqueo'})[type];
    OCC[k(+e.d,e.t,+e.c)]={type,label:type==='fijo'?'Turno fijo '+name:name,players:[],src:type==='bloqueo'?null:'recepción'};
    state.sheet=null; toast('Guardado en la grilla');
  },
  'club-occ':e=>{state.sheet={kind:'club-occ',d:+e.d,t:e.t,c:+e.c};},
  'club-free':e=>{ delete OCC[k(+e.d,e.t,+e.c)]; state.sheet=null; toast('Cancha liberada'); },
  'club-tab':e=>{state.clubTab=e.v;},
  'toggle-up':()=>{state.showAllUp=!state.showAllUp;},
  'only-free':()=>{state.onlyFree=!state.onlyFree;},
  'show-past':()=>{state.showPast=!state.showPast;},
  /* torneos */
  'open-tourn':e=>{state.sheet={kind:'tourn',tid:e.tid};},
  'tourn-join':e=>{
    const tr=T.find(x=>x.id===e.tid), j=tCanJoin(tr);
    if(!j.ok){toast(j.why);return;}
    if(slotsOf(tr).some(t=>isBusy('me',tr.d,t))){toast('Ya tenés un partido en ese horario');return;}
    tr.players.push('me'); toast(`Te inscribiste. Quedan ${tr.size-tr.players.length} lugares.`);
  },
  'tourn-leave':e=>{ const tr=T.find(x=>x.id===e.tid); tr.players=tr.players.filter(p=>p!=='me'); toast('Te diste de baja del torneo'); },
  'tourn-fill':e=>{
    const tr=T.find(x=>x.id===e.tid); let g=0;
    const pool=Object.values(P).filter(p=>p.id!=='me'&&!tr.players.includes(p.id)&&(tr.gender==='X'||p.g===tr.gender)&&p.cat>=tr.catMin&&p.cat<=tr.catMax&&!slotsOf(tr).some(t=>isBusy(p.id,tr.d,t)));
    while(tr.players.length<tr.size){
      const p=pool.shift();
      if(p) tr.players.push(p.id);
      else { const id='g'+(++seq); addP(id,`Invitado ${++g}`,tr.gender==='F'?'F':'M',tr.catMin,'ambos','diestro',90,[]); tr.players.push(id); }
    }
    toast('Cupo completo. Ya podés generar el fixture.');
  },
  'tourn-gen':e=>{ const tr=T.find(x=>x.id===e.tid); genFixture(tr); toast(`Fixture listo: ${tr.rounds} rondas`); },
  'tourn-end':e=>{ const tr=T.find(x=>x.id===e.tid); tr.status='finalizado'; toast('Torneo cerrado. Ranking publicado.'); },
  'tourn-create':()=>{
    // proponer el primer horario de la semana con dos canchas libres durante todo el torneo
    const base={name:'Americano de la semana',size:8,points:24,minRound:20,rounds:7,catMin:4,catMax:6,gender:'M',price:400};
    let form=null;
    for(let d=1;d<7&&!form;d++) for(const t of ['18:30','17:00','20:00','15:30','14:00']){
      for(const cs of [[1,2],[2,3],[1,3]]){ const f={...base,d,t,courts:cs}; if(!conflictsOf(f).length){form=f;break;} }
      if(form) break;
    }
    state.sheet={kind:'tourn-create',form:form||{...base,d:1,t:'18:30',courts:[1,2]}};
  },
  'tourn-save':()=>{
    const v=id=>document.getElementById(id).value;
    const f={name:v('tc-name').trim()||'Americano',d:+v('tc-d'),t:v('tc-t'),size:+v('tc-size'),rounds:+v('tc-rounds'),points:+v('tc-pts'),minRound:+v('tc-min'),catMin:+v('tc-cmin'),catMax:+v('tc-cmax'),gender:v('tc-g'),price:+v('tc-price')||0,
      courts:[...document.querySelectorAll('.tc-court:checked')].map(x=>+x.value)};
    let err=null;
    if(!f.courts.length) err='Elegí al menos una cancha.';
    else if(f.rounds>f.size-1) err=`Con ${f.size} jugadores el máximo es ${f.size-1} rondas (cada uno juega una vez con cada otro).`;
    else if(f.catMin>f.catMax) err='La categoría "desde" tiene que ser igual o mejor que "hasta".';
    else { const c=conflictsOf(f); if(c.length) err='No se puede bloquear: '+c.join('; ')+'.'; }
    if(err){ state.sheet={kind:'tourn-create',form:f,error:err}; return; }
    const tr=mkT(f); state.sheet={kind:'tourn',tid:tr.id};
    toast(`Torneo creado. Canchas ${tr.courts.join(' y ')} bloqueadas de ${tr.t} a ${endTime(tr)}.`);
  },
  /* day use */
  'du-buy':()=>{state.sheet={kind:'du-buy'};},
  'du-pick':e=>{state.sheet={...state.sheet,product:e.v};},
  'du-confirm':()=>{
    const s=state.sheet, dd=state.duDay||0, avail=productsOn(dd);
    const pr=productOf((s.product&&avail.some(p=>p.id===s.product))?s.product:avail[0].id);
    if(soldOn(pr.id,dd)>=pr.cupo){toast('No quedan lugares para ese pase');return;}
    const useR=rewardApplies('me')&&(DU.loyalty.scope==='todos'||DU.loyalty.scope===pr.id)&&s.useReward!==false;
    const code=passCode();
    const x={id:'x'+(++pseq),pid:'me',product:pr.id,free:useR,price:useR?rewardPrice(pr):pr.price,status:'pendiente',code,src:'online',d:dd};
    DU.passes.push(x); state.sheet={kind:'du-pass',id:x.id};
  },
  'du-pass':e=>{state.sheet={kind:'du-pass',id:e.id};},
  'du-edit':e=>{ const pr=productOf(e.v); if(state.role!=='club'){ state.role='club'; state.clubTab='dayuse'; } state.sheet={kind:'du-edit',draft:{...pr,days:[...pr.days],courts:[...pr.courts]}}; },
  'du-d-day':e=>{ const f=state.sheet.draft, x=+e.v; f.days=f.days.includes(x)?f.days.filter(y=>y!==x):[...f.days,x]; },
  'du-d-court':e=>{ const f=state.sheet.draft, x=+e.v; f.courts=f.courts.includes(x)?f.courts.filter(y=>y!==x):[...f.courts,x].sort(); },
  'du-save':()=>{
    const f=state.sheet.draft, pr=productOf(f.id);
    f.cupo=Math.max(1,+document.getElementById('de-cupo').value||pr.cupo); f.price=Math.max(0,+document.getElementById('de-price').value||0);
    Object.assign(pr,{days:f.days,from:f.from,to:f.to,courts:f.courts,cupo:f.cupo,price:f.price});
    applyDayUse(false); state.sheet=null;
    toast(`Guardado. ${pr.courts.length?`La grilla ya muestra ${pr.courts.length>1?'las canchas '+pr.courts.join(' y ')+' bloqueadas':'la Cancha '+pr.courts[0]+' bloqueada'}: ${daysText(pr.days).toLowerCase()}, de ${pr.from} a ${pr.to}.`:'Este pase no bloquea canchas.'}`);
  },
  'cal-view':e=>{ state.calView=e.v; },
  'cal-sel':e=>{ state.calSel=e.v; const dt=fromIso(e.v); state.calMonth=iso(new Date(dt.getFullYear(),dt.getMonth(),1)); },
  'cal-today':()=>{ state.calSel=iso(today); state.calMonth=iso(new Date(today.getFullYear(),today.getMonth(),1)); },
  'cal-prev':()=>A['cal-shift']({v:-1}),
  'cal-next':()=>A['cal-shift']({v:1}),
  'cal-shift':e=>{
    const {sel,month,view}=calState();
    if(view==='mes'){ const m=new Date(month.getFullYear(),month.getMonth()+e.v,1); state.calMonth=iso(m); state.calSel=iso(m.getMonth()===today.getMonth()&&m.getFullYear()===today.getFullYear()?today:m); }
    else { const d=addDays(sel,7*e.v); state.calSel=iso(d); state.calMonth=iso(new Date(d.getFullYear(),d.getMonth(),1)); }
  },
  'cal-grid':e=>{ state.clubDay=+e.v; state.clubTab='grilla'; },
  'cal-toggle':e=>{
    const dt=fromIso(e.v), pr=productOf(e.pid), on=enabledOnDate(pr,dt), i=idxOf(dt);
    if(on && i>=0 && soldOn(pr.id,i) && !e.ok){ state.sheet={kind:'cal-confirm',v:e.v,pid:e.pid}; return; }
    state.sheet=null;
    const o=DU.overrides[e.v]||{};
    if(!on===defaultOn(pr,dt)) delete o[pr.id]; else o[pr.id]=!on;
    if(Object.keys(o).length) DU.overrides[e.v]=o; else delete DU.overrides[e.v];
    applyDayUse(false);
    toast(`${pr.name}: ${!on?'se vende':'no se vende'} el ${longDate(dt).toLowerCase()}${on&&i>=0&&soldOn(pr.id,i)?'. Avisamos a quienes ya compraron':''}`);
  },
  'cal-close':e=>{
    const dt=fromIso(e.v);
    if(soldOnDate(dt) && !e.ok){ state.sheet={kind:'cal-confirm',v:e.v}; return; }
    state.sheet=null;
    const o={}; DU.products.forEach(pr=>{ if(defaultOn(pr,dt)) o[pr.id]=false; });
    if(Object.keys(o).length) DU.overrides[e.v]=o; else delete DU.overrides[e.v];
    applyDayUse(false);
    toast(`Day use cerrado el ${longDate(dt).toLowerCase()}. Las canchas quedan libres para reservar.`);
  },
  'cal-reset':e=>{ delete DU.overrides[e.v]; applyDayUse(false); toast('Ese día vuelve a su horario habitual'); },
  'du-checkin':e=>{
    const x=DU.passes.find(p=>p.id===e.id); x.status='adentro'; visit(x.pid,0,x.product,x.free);
    const l=loyaltyOf(x.pid), n=first(P[x.pid].name);
    toast(!DU.loyalty.on?`Ingreso de ${n} registrado`:x.free?`${n} usó su recompensa`:l.progress===0?`${n} completó ${DU.loyalty.every} y ganó ${rewardLabel()}`:`Ingreso registrado. ${n} lleva ${l.progress} de ${DU.loyalty.every}.`);
  },
  'du-sell':()=>{state.sheet={kind:'du-sell',pid:'p1'};},
  'du-sell-ok':()=>{
    const pid=document.getElementById('ds-p').value, pr=productOf(document.getElementById('ds-prod').value);
    const r=document.getElementById('ds-r'); const useR=!!(r&&r.checked)&&(DU.loyalty.scope==='todos'||DU.loyalty.scope===pr.id);
    if(soldToday(pr.id)>=pr.cupo){toast('No quedan pases de ese tipo hoy');return;}
    const code=passCode(), id='x'+(++pseq);
    DU.passes.push({id,pid,product:pr.id,free:useR,price:useR?rewardPrice(pr):pr.price,status:'pendiente',code,src:'recepción'});
    state.sheet=null; A['du-checkin']({id});
  },
  'loy-on':e=>{DU.loyalty.on=e.v==='1';},
  'loy-every':e=>{DU.loyalty.every=Math.min(20,Math.max(2,DU.loyalty.every+(+e.v)));},
  'loy-reward':e=>{DU.loyalty.reward=e.v;},
  'loy-scope':e=>{DU.loyalty.scope=e.v;},
  'loy-exp':e=>{DU.loyalty.expiry=+e.v;},
  'loy-free':e=>{DU.loyalty.freeCounts=e.v==='1';}
};
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-change]'); if(!el) return;
  const c=el.dataset.change;
  if(c==='score'){
    const tr=T.find(x=>x.id===el.dataset.tid), g=tr.fixture[+el.dataset.r][+el.dataset.g], n=parseInt(el.value,10);
    if(isNaN(n)){g.sa=null;g.sb=null;} else {g.sa=Math.max(0,Math.min(tr.points,n)); g.sb=tr.points-g.sa;}
  }
  if(c==='du-reward') state.sheet.useReward=el.checked;
  if(c==='du-sell-p') state.sheet.pid=el.value;
  if(c==='du-draft') state.sheet.draft[el.dataset.f]=el.value;
  render();
});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-action]'); if(!el) return;
  const fn=A[el.dataset.action]; if(!fn) return;
  if(el.tagName==='A') return;
  ev.preventDefault(); fn(el.dataset); render();
});
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-filter="passes"]'); if(!el) return;
  const q=el.value.trim().toLowerCase();
  document.querySelectorAll('.passrow').forEach(r=>{ r.hidden = q && !r.dataset.q.includes(q); });
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&state.sheet){ state.sheet=null; render(); } });
render();
</script>
</body>
</html>
